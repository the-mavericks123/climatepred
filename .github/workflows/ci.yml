name: Climate Eye View CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-suite:
    name: S2 Intelligence Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r intelligence/requirements.txt

      - name: Run Full Regression Suite (Phases 1-11)
        run: |
          pytest intelligence/tests/ -v --tb=short

  gev-frontend-build:
    name: GEV Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gods-eye-view/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./gods-eye-view
        run: npm ci

      - name: Build GEV Distribution Bundle
        working-directory: ./gods-eye-view
        run: npm run build

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Compose File Syntax
        run: docker compose config
