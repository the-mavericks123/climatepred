# Climate Eye View: Production Application Configuration

service:
  name: "climate-eye-view-intelligence"
  environment: "production"
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  json_logging: true

security:
  auth_enabled: false # Enabled via API_AUTH_ENABLED in prod
  allowed_origins:
    - "https://climate-eye.local"
    - "https://gev.internal"
  max_request_body_bytes: 10485760 # 10MB
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_capacity: 10

network:
  external_service_timeout_sec: 5.0
  max_retries: 3
  retry_backoff_factor: 1.5
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_sec: 30.0

freshness:
  telemetry_threshold_sec: 300
  prediction_window_min: 180
  stale_confidence_penalty: 0.35
