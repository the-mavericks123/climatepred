# Eclipse Mosquitto — Production Configuration for Climate Eye View
# Strictly disables anonymous access, enforces password authentication and topic ACLs.

# Listener configuration
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for God's Eye View telemetry bridge (optional)
listener 9001 0.0.0.0
protocol websockets

# Security & Access Control
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acls

# Persistence & Storage
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
autosave_on_changes false

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Resource Limits
max_connections 1000
max_queued_messages 1000
message_size_limit 262144
